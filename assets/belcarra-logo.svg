<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <defs>
    <!-- Orange Ring Gradients -->
    <linearGradient id="ringGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="35%" stop-color="#FFA726" />
      <stop offset="70%" stop-color="#FB8C00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <radialGradient id="ringHighlight" cx="45%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFA726" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#E65100" stop-opacity="0" />
    </radialGradient>
    
    <!-- Purple Swoosh Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A148C" />
      <stop offset="40%" stop-color="#7B1FA2" />
      <stop offset="70%" stop-color="#8E24AA" />
      <stop offset="100%" stop-color="#AB47BC" />
    </linearGradient>

    <!-- Drop Shadow for subtle depth -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <g transform="translate(160, 95)">
    <!-- Orange Elliptical Ring (tilted ~ -32 deg) -->
    <g transform="rotate(-30)">
      <!-- Outer & Inner path for ring -->
      <path d="M 0,-70 C 58,-70 102,-38 102,0 C 102,38 58,70 0,70 C -58,70 -102,38 -102,0 C -102,-38 -58,-70 0,-70 Z M 0,-40 C -34,-40 -60,-22 -60,0 C -60,22 -34,40 0,40 C 34,40 60,22 60,0 C 60,-22 34,-40 0,-40 Z"
            fill="url(#ringGrad)"
            filter="url(#shadow)" />
      <!-- Subtle ring bevel/highlight overlay -->
      <path d="M 0,-70 C 58,-70 102,-38 102,0 C 102,38 58,70 0,70 C -58,70 -102,38 -102,0 C -102,-38 -58,-70 0,-70 Z M 0,-40 C -34,-40 -60,-22 -60,0 C -60,22 -34,40 0,40 C 34,40 60,22 60,0 C 60,-22 34,-40 0,-40 Z"
            fill="url(#ringHighlight)" />
    </g>

    <!-- Purple Crescent Swoosh looping through and shooting across -->
    <path d="M -88,18 
             C -98,-15 -85,-52 -55,-68 
             C -32,-80 -5,-78 25,-60 
             C 65,-36 100,-15 130,-14
             C 110,-12 70,-18 35,-32
             C 5,-45 -22,-44 -42,-32
             C -68,-16 -75,10 -58,35
             C -45,55 -20,65 10,65
             C -25,72 -68,62 -88,18 Z"
          fill="url(#purpleGrad)"
          filter="url(#shadow)" />
  </g>

  <!-- Wordmark -->
  <text x="160" y="215" 
        text-anchor="middle" 
        font-family="'IBM Plex Sans', 'Segoe UI', -apple-system, sans-serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="5" 
        fill="#111827">BELCARRA</text>

  <text x="160" y="245" 
        text-anchor="middle" 
        font-family="'IBM Plex Sans', 'Segoe UI', -apple-system, sans-serif" 
        font-size="14" 
        font-weight="500" 
        letter-spacing="9" 
        fill="#1f2937">TECHNOLOGIES</text>
</svg>
