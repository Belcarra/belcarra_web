name: Cloudflare Pages

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: node --check assets/site.js
      - name: Test contact handler
        run: node scripts/test_contact.mjs
      - name: Test chat handler and rate limits
        run: |
          python3 scripts/site_knowledge.py
          python3 scripts/test_site_knowledge.py
          node scripts/test_chat.mjs
      - name: Validate and stage public files
        env:
          SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL || 'https://belcarra-web.pages.dev' }}
        run: python3 scripts/build_site.py --site-url "$SITE_URL"
      - name: Test Google Analytics inclusion
        run: python3 scripts/test_analytics.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: public-site
          path: dist
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Set the CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Set the CLOUDFLARE_ACCOUNT_ID repository secret'; exit 1; }
          test -n "$CLOUDFLARE_WORKERS_API_TOKEN" || { echo '::error::Set the CLOUDFLARE_WORKERS_API_TOKEN repository secret'; exit 1; }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Rebuild assistant references from this checkout
        run: python3 scripts/site_knowledge.py
      - name: Deploy private contact mail Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config worker/wrangler.jsonc
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'belcarra-web' }} --branch=develop
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
